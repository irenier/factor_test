[project]
name = "factor-test"
version = "0.1.0"
description = "Performance analysis of alpha factors"
readme = "README.md"
authors = [
    { name = "irenier", email = "irantan@163.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "polars>=2.0.0",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
example = [
    "akshare>=1.19.3",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
